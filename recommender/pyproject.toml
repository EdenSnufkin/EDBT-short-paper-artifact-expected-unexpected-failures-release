[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-recommender"
version = "0.1.0"
description = "Multi-objective hill-climbing and bandit question recommender used in the expected/unexpected failure user study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["adaptive_recommender"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
